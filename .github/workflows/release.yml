name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxi-dev libxrandr-dev libhidapi-dev \
            pkg-config build-essential libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev libdbus-1-dev clang grim

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build & Package Universal Tarball
        run: |
          chmod +x package-release.sh
          ./package-release.sh

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            loq-rgb-controller-linux-x86_64.tar.gz
            loq-rgb-controller-linux-x86_64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
