[package]
name = "led-controller-driver"
version = "3.1.2"
description = "Rust driver for lenovo 24 zone rgb keyboard"
authors = ["Dhananjay"]
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hidapi = "2.4"
once_cell = "1.19"
rand = "0.8"
winreg = "0.52"
sysinfo = "0.38.0"
nvml-wrapper = "0.11.0"
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
windows = { version = "0.52", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Devices_Properties",
] }
anyhow = "1.0"
rdev = "0.5"

[lib]
name = "rgb_backend"
path = "src/lib.rs"
crate-type = ["cdylib"]

