<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOQ RGB Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030208;
      --surface: rgba(13, 11, 24, 0.7);
      --surface2: rgba(22, 19, 39, 0.85);
      --surface-accent: rgba(139, 92, 246, 0.08);
      --border: rgba(255, 255, 255, 0.06);
      --border-focus: rgba(139, 92, 246, 0.4);
      --accent: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #8b5cf6, #d946ef);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --error: #ef4444;
      --radius: 12px;
      --shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top right, #1a103c, #030208);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.16); }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 6, 15, 0.8);
      backdrop-filter: blur(20px);
      z-index: 10;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 34px; height: 34px;
      background: var(--accent-gradient);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
    }

    .logo-text h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
    .logo-text p { font-size: 11px; color: var(--text-muted); }

    .status-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px; font-weight: 500;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(8px);
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--error);
      box-shadow: 0 0 8px var(--error);
    }
    .status-dot.connected { background: var(--success); box-shadow: 0 0 10px var(--success); }

    /* Main layout */
    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      min-height: 0; /* Important to let inner elements scroll correctly */
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      background: var(--surface);
      backdrop-filter: blur(30px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .sidebar-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .brightness-row {
      display: flex; align-items: center; gap: 12px;
    }

    .brightness-row span { font-size: 16px; }

    input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      cursor: pointer;
      transition: transform 0.15s, background-color 0.15s;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
      background: #a78bfa;
    }

    .brightness-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--accent);
      min-width: 36px; text-align: right;
    }

    .preset-search-container {
      padding: 14px 16px 8px 16px;
      flex-shrink: 0;
    }

    .preset-search {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      transition: all 0.2s;
    }

    .preset-search:focus {
      border-color: var(--accent-gradient);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.15);
    }

    .preset-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 16px 8px;
    }

    .preset-item {
      padding: 10px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex; flex-direction: column; gap: 4px;
      border: 1px solid transparent;
      margin-bottom: 6px;
    }

    .preset-item:hover {
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(255, 255, 255, 0.03);
    }

    .preset-item.active {
      background: var(--surface-accent);
      border-color: rgba(139, 92, 246, 0.25);
      box-shadow: inset 0 0 8px rgba(139, 92, 246, 0.05);
    }

    .preset-item.active .preset-name {
      color: #a78bfa;
    }

    .preset-name { font-size: 13px; font-weight: 600; color: var(--text); transition: color 0.2s; }
    .preset-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

    .fav-star {
      background: none;
      border: none;
      font-size: 15px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      transition: all 0.15s ease;
      line-height: 1;
    }
    .fav-star:hover {
      transform: scale(1.3);
      color: #f59e0b;
    }
    .fav-star.active {
      color: #f59e0b;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }

    /* Content Area */
    .content {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.15);
    }

    /* Live Preview Section */
    .keyboard-panel {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.01);
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 10px; font-weight: 700;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .keyboard-viz {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      aspect-ratio: 1280/480;
      background: #050409;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 24px;
      overflow: visible;
    }

    .keyboard-viz::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('/static/layout.png') no-repeat center;
      background-size: contain;
      filter: invert(1) brightness(1.6); /* Inverts black outlines to glowing white outlines! */
      opacity: 0.28; /* Subtle keyboard outlines */
      pointer-events: none;
      z-index: 1;
      border-radius: 9px;
    }

    /* Blurred container for soft color transitions */
    .zone-glow-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      border-radius: 9px;
      pointer-events: none;
      filter: blur(14px); /* Fades boundaries between zones! */
      mix-blend-mode: screen;
      opacity: 0.65;
    }

    .zone-glow {
      position: absolute;
      top: 0; bottom: 0;
      transition: background 0.08s ease;
    }

    /* Sharp interactive layer for hover, selection, and labels */
    .zone-interactive-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 9px;
      z-index: 5;
    }

    .zone-bar {
      position: absolute;
      top: 0; bottom: 0;
      cursor: crosshair;
      border-left: 1px dashed rgba(255, 255, 255, 0.02);
      border-right: 1px dashed rgba(255, 255, 255, 0.02);
      transition: all 0.15s ease;
      z-index: 2;
    }

    /* Subtle visibility of zone boundaries on hover */
    .zone-bar:hover {
      background: rgba(255, 255, 255, 0.06);
      border-left-color: rgba(255, 255, 255, 0.15);
      border-right-color: rgba(255, 255, 255, 0.15);
    }

    /* Selection styling in Static Color mode */
    .zone-bar.selected {
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      z-index: 6;
    }

    .zone-bar::after {
      content: attr(data-zone);
      position: absolute;
      bottom: -20px;
      left: 50%; transform: translateX(-50%);
      font-size: 9px;
      font-weight: 600;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      z-index: 7;
      pointer-events: none;
    }

    /* Highlight zone numbers for selected zones */
    .zone-bar.selected::after {
      color: #ffffff;
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
    }

    /* Parameters Panel */
    .params-panel {
      padding: 20px 24px;
      flex: 1;
      overflow: hidden;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .preset-header {
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .preset-header h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
    .preset-header p { font-size: 12px; color: var(--text-muted); }

    .params-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      align-content: start;
      margin-bottom: 20px;
    }

    /* Custom Forms & Cards */
    .param-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: all 0.2s;
    }

    .param-card:hover { border-color: rgba(139, 92, 246, 0.2); }

    .param-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .param-slider-row {
      display: flex; align-items: center; gap: 12px;
    }

    .param-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--accent);
      min-width: 38px; text-align: right;
    }

    .color-row {
      display: flex; align-items: center; gap: 12px;
    }

    input[type=color] {
      width: 44px; height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: none; cursor: pointer;
      padding: 0;
    }

    /* Select Dropdowns */
    .param-select {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .param-select:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Interactive 24-Zone Palette Editor */
    .zone-editor-container {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .zone-editor-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
    }

    .zone-editor-cell {
      aspect-ratio: 1.2;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: #11111a;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      user-select: none;
    }

    .zone-editor-cell:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .zone-editor-cell.selected {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      box-shadow: 0 0 12px var(--accent);
      z-index: 2;
    }

    .zone-editor-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
    }

    .zone-editor-actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-sm:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .gradient-builder {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      margin-left: auto;
    }

    /* Layer Editor Custom UI */
    .layers-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-layer-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .layer-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.2s;
    }

    .layer-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .layer-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .layer-opacity-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .layer-settings-toggle {
      font-size: 11px;
      color: var(--accent);
      cursor: pointer;
      margin-left: auto;
      text-decoration: underline;
      background: none;
      border: none;
      font-family: inherit;
    }

    .layer-sub-params {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }

    .layer-action-btn {
      width: 26px; height: 26px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .layer-action-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .apply-bar {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .apply-btn {
      padding: 12px 28px;
      border-radius: var(--radius);
      border: none;
      background: var(--accent-gradient);
      color: white;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
    }

    .apply-btn:hover {
      opacity: 0.95;
      transform: translateY(-1.5px);
      box-shadow: 0 6px 24px rgba(139, 92, 246, 0.45);
    }

    .apply-btn:active { transform: translateY(0.5px); }

    .reset-btn {
      padding: 12px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      transform: translateY(-1px);
    }

    .reset-btn:active {
      transform: translateY(0.5px);
    }

    .no-params {
      color: var(--text-muted);
      font-size: 13px;
      padding: 12px 0;
    }

    /* Toast - Placed top-center, sliding down */
    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translate(-50%, -100px);
      background: #0b0a12;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
      font-size: 13px;
      box-shadow: var(--shadow);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 999;
    }

    #toast.show { transform: translate(-50%, 0); opacity: 1; }
    #toast.ok { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.05); }
    #toast.err { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.05); }

    /* Ambient Screen Selector */
    .ambient-editor-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 24px;
    }
    .ambient-section-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .ambient-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 10px;
    }
    .ambient-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ambient-section-badge {
      font-size: 10px;
      font-weight: 500;
      color: var(--primary);
      background: rgba(139, 92, 246, 0.15);
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .mock-screen-wrapper {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: #06040a;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16/9;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0,0,0,0.8);
      user-select: none;
      touch-action: none;
    }
    .mock-screen-bg {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 40%, #1e1538 0%, #0c0718 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      position: relative;
    }
    .mock-screen-text {
      color: rgba(255, 255, 255, 0.18);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      pointer-events: none;
    }
    .crop-rect {
      position: absolute;
      border: 2px solid #8b5cf6;
      background: rgba(139, 92, 246, 0.18);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.35), inset 0 0 15px rgba(139, 92, 246, 0.2);
      cursor: move;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .crop-rect.active-drag {
      border-color: #ec4899;
      background: rgba(236, 72, 153, 0.22);
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.45);
    }
    .crop-zones-grid {
      position: absolute;
      inset: 0;
      display: flex;
      pointer-events: none;
      opacity: 0.45;
    }
    .crop-zone-col {
      flex: 1;
      border-right: 1px dashed rgba(255, 255, 255, 0.2);
      height: 100%;
      box-sizing: border-box;
    }
    .crop-zone-col:last-child {
      border-right: none;
    }
    .crop-info-badge {
      position: absolute;
      top: 6px;
      left: 8px;
      background: rgba(10, 8, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: #e2e8f0;
      pointer-events: none;
      white-space: nowrap;
      z-index: 5;
    }
    .crop-handle {
      position: absolute;
      background: #d946ef;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      z-index: 10;
      box-sizing: border-box;
    }
    .crop-handle.corner {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .crop-handle.corner.nw { top: -6px; left: -6px; cursor: nwse-resize; }
    .crop-handle.corner.ne { top: -6px; right: -6px; cursor: nesw-resize; }
    .crop-handle.corner.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
    .crop-handle.corner.se { bottom: -6px; right: -6px; cursor: nwse-resize; }

    .crop-handle.edge {
      background: #8b5cf6;
      border-radius: 4px;
    }
    .crop-handle.edge.n { top: -4px; left: 50%; transform: translateX(-50%); width: 26px; height: 8px; cursor: ns-resize; }
    .crop-handle.edge.s { bottom: -4px; left: 50%; transform: translateX(-50%); width: 26px; height: 8px; cursor: ns-resize; }
    .crop-handle.edge.w { left: -4px; top: 50%; transform: translateY(-50%); width: 8px; height: 26px; cursor: ew-resize; }
    .crop-handle.edge.e { right: -4px; top: 50%; transform: translateY(-50%); width: 8px; height: 26px; cursor: ew-resize; }

    .crop-presets-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 4px;
    }
    .crop-preset-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .crop-preset-btn:hover {
      background: rgba(139, 92, 246, 0.2);
      border-color: #8b5cf6;
      color: #fff;
      transform: translateY(-1px);
    }
    .crop-preset-btn.active {
      background: #8b5cf6;
      border-color: #8b5cf6;
      color: #fff;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
    }
    .coords-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (max-width: 600px) {
      .coords-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .coord-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .coord-box-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .coord-box-input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-primary);
      width: 100%;
      box-sizing: border-box;
    }
    .coord-box-input:focus {
      outline: none;
      border-color: #8b5cf6;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">✨</div>
    <div class="logo-text">
      <h1>LOQ RGB Controller</h1>
      <p>Lenovo LOQ 24-Zone Control Center</p>
    </div>
  </div>
  <div class="status-badge" id="statusBadge">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Connecting…</span>
  </div>
</header>

<main>
  <!-- Sidebar -->
  <aside>
    <div class="sidebar-section">
      <div class="sidebar-label">Brightness</div>
      <div class="brightness-row">
        <span>🌑</span>
        <input type="range" id="brightnessSlider" min="0" max="100" value="100">
        <span>☀️</span>
        <div class="brightness-val" id="brightnessVal">100%</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Preset Cycle & Hotkey</div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:12px; font-weight:500; color:var(--text-muted);">Shortcut</span>
          <div style="display:flex; gap:6px; align-items:center;">
            <input id="shortcutInput" class="preset-search" style="width:90px; padding:4px 8px; font-size:11px; text-align:center; font-family:'JetBrains Mono',monospace;" value="Alt+P" readonly placeholder="Click to record">
            <button class="btn-sm" id="btnRecordShortcut" style="padding:4px 8px; font-size:11px;">Record</button>
          </div>
        </div>
        <button class="btn-sm" id="btnCycleNow" style="width:100%; padding:8px; font-weight:600; background:var(--surface-accent); border-color:var(--border-focus); color:#a78bfa;">Cycle Preset 🔄</button>
      </div>
    </div>

    <div class="preset-search-container">
      <div class="sidebar-label">Search Effects</div>
      <input class="preset-search" id="presetSearch" placeholder="Filter presets…" autocomplete="off">
    </div>

    <div class="preset-list" id="presetList">
      <div style="color:var(--text-muted); font-size:12px; padding:12px;">Loading presets…</div>
    </div>
  </aside>

  <!-- Content -->
  <div class="content">
    <div class="keyboard-panel">
      <div class="panel-title">Live Device Preview (24 Zones)</div>
      <div class="keyboard-viz" id="keyboardViz">
        <!-- JS generated zones -->
      </div>
    </div>

    <div class="params-panel" id="paramsPanel">
      <div class="preset-header">
        <h2 id="paramPresetName">Select an effect</h2>
        <p id="paramPresetDesc">Choose a lighting layout from the list on the left.</p>
      </div>
      <div id="customParamsArea" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; padding-right: 8px; margin-bottom: 12px;">
        <div class="params-grid" id="paramsGrid"></div>
      </div>
      <div class="apply-bar" id="applyBar" style="display: none;">
        <button class="reset-btn" id="resetBtn">Reset Defaults ↺</button>
        <button class="apply-btn" id="applyBtn" style="flex: 1;">Apply Effect ✦</button>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let presets = [];
let selectedPreset = null;
let paramValues = {};
let ws = null;
let brightnessDebounce = null;
let presetTweaks = {};
let presetCycleEffects = [];
let presetCycleShortcut = "Alt+P";
let isRecordingShortcut = false;

// Static Editor State
let staticColors = Array(24).fill({ r: 255, g: 255, b: 255 });
let selectedStaticZones = new Set();
let isMouseDown = false;

// Layered Editor State
let layeredConfig = [];
let openLayerSettingsIndex = null;

// ─── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  buildKeyboard();
  await loadPresets();
  await refreshStatus();
  connectWS();
  setupBrightness();
  setupShortcutRecorder();

  document.getElementById('btnCycleNow').addEventListener('click', cyclePresetNow);
  document.addEventListener('mouseup', () => { isMouseDown = false; });
});

// ─── Keyboard viz ────────────────────────────────────────────────────────────
function buildKeyboard() {
  const viz = document.getElementById('keyboardViz');
  viz.innerHTML = `
    <div class="zone-glow-container" id="zoneGlowContainer"></div>
    <div class="zone-interactive-container" id="zoneInteractiveContainer"></div>
  `;
  
  const glowContainer = document.getElementById('zoneGlowContainer');
  const interactiveContainer = document.getElementById('zoneInteractiveContainer');
  
  for (let i = 0; i < 24; i++) {
    // 1. Glow element (blurred visual overlay)
    const glow = document.createElement('div');
    glow.className = 'zone-glow';
    glow.dataset.zone = i;
    glow.style.left = `${(i * 100) / 24}%`;
    glow.style.width = `${100 / 24}%`;
    glowContainer.appendChild(glow);
    
    // 2. Interactive bar element (sharp click/drag overlay)
    const bar = document.createElement('div');
    bar.className = 'zone-bar';
    bar.dataset.zone = i + 1; // 1-based indexing for user interface
    bar.title = `Zone ${i + 1}`;
    bar.style.left = `${(i * 100) / 24}%`;
    bar.style.width = `${100 / 24}%`;
    
    // Wire up drag-to-select directly on the layout image!
    bar.addEventListener('mousedown', (e) => {
      if (selectedPreset && selectedPreset.name === 'staticColor') {
        isMouseDown = true;
        e.preventDefault();
        toggleZoneSelection(i, bar);
      }
    });
    
    bar.addEventListener('mouseenter', () => {
      if (isMouseDown && selectedPreset && selectedPreset.name === 'staticColor') {
        toggleZoneSelection(i, bar);
      }
    });
    
    interactiveContainer.appendChild(bar);
  }
}
function updateFrame(zones) {
  const glows = document.querySelectorAll('.zone-glow');
  zones.forEach(([r, g, b], i) => {
    if (glows[i]) {
      if (r === 0 && g === 0 && b === 0) {
        glows[i].style.background = 'transparent';
      } else {
        glows[i].style.background = `rgb(${r},${g},${b})`;
      }
    }
  });
}

// ─── WebSocket connection ─────────────────────────────────────────────────────
function connectWS() {
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${protocol}://${location.host}/ws`);
  ws.onmessage = e => {
    try { updateFrame(JSON.parse(e.data)); } catch(_) {}
  };
  ws.onclose = () => setTimeout(connectWS, 2000);
}

// ─── API Client ───────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? {'Content-Type': 'application/json'} : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  return res.json();
}

// ─── Refresh Status ───────────────────────────────────────────────────────────
async function refreshStatus() {
  try {
    const s = await api('GET', '/api/status');
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if (s.connected) {
      dot.classList.add('connected');
      txt.textContent = 'HID Connected';
    } else {
      dot.classList.remove('connected');
      txt.textContent = 'No Device';
    }
    document.getElementById('brightnessSlider').value = Math.round(s.brightness * 100);
    document.getElementById('brightnessVal').textContent = Math.round(s.brightness * 100) + '%';
    
    // Cache saved parameters and cycle settings
    presetTweaks = s.preset_tweaks || {};
    presetCycleEffects = s.preset_cycle_effects || [];
    presetCycleShortcut = s.preset_cycle_shortcut || "Alt+P";

    if (!isRecordingShortcut) {
      document.getElementById('shortcutInput').value = presetCycleShortcut;
    }

    renderPresetList(presets);

    if (s.preset) {
      highlightActive(s.preset);
      const activePresetObj = presets.find(p => p.name === s.preset);
      if (activePresetObj) {
        selectPreset(activePresetObj, false);
      }
    }
  } catch(e) {}
}

// ─── Load Presets ─────────────────────────────────────────────────────────────
async function loadPresets() {
  presets = await api('GET', '/api/presets');
  renderPresetList(presets);
}

function renderPresetList(list) {
  const el = document.getElementById('presetList');
  el.innerHTML = '';
  list.forEach(p => {
    const item = document.createElement('div');
    item.className = 'preset-item';
    item.dataset.name = p.name;

    const isFav = presetCycleEffects.some(x => x.toLowerCase() === p.name.toLowerCase());

    item.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
        <div class="preset-name">${p.display_name}</div>
        <button class="fav-star ${isFav ? 'active' : ''}" title="${isFav ? 'Remove from cycle' : 'Add to favorite cycle'}">${isFav ? '★' : '☆'}</button>
      </div>
      <div class="preset-desc">${p.description}</div>
    `;

    const starBtn = item.querySelector('.fav-star');
    starBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await toggleFavorite(p.name);
    });

    item.addEventListener('click', () => selectPreset(p, true));
    el.appendChild(item);
  });
}

async function toggleFavorite(presetName) {
  const idx = presetCycleEffects.findIndex(x => x.toLowerCase() === presetName.toLowerCase());
  if (idx >= 0) {
    presetCycleEffects.splice(idx, 1);
    toast(`Removed from favorites cycle`, 'ok');
  } else {
    presetCycleEffects.push(presetName);
    toast(`Added to favorites cycle (⭐)`, 'ok');
  }
  await saveCycleSettings();
  renderPresetList(presets);
}

async function saveCycleSettings() {
  try {
    await api('POST', '/api/settings', {
      preset_cycle_effects: presetCycleEffects,
      preset_cycle_shortcut: presetCycleShortcut,
    });
  } catch(e) {}
}

async function cyclePresetNow() {
  try {
    const res = await api('POST', '/api/cycle');
    if (res.ok && res.preset) {
      const meta = presets.find(p => p.name === res.preset);
      const name = meta ? meta.display_name : res.preset;
      toast(`🔄 Cycled to: ${name}`, 'ok');
      await refreshStatus();
    } else {
      toast(res.error || 'No favorite presets in cycle list', 'err');
    }
  } catch(e) {
    toast('Failed to cycle preset', 'err');
  }
}

function setupShortcutRecorder() {
  const input = document.getElementById('shortcutInput');
  const recordBtn = document.getElementById('btnRecordShortcut');

  recordBtn.addEventListener('click', () => {
    if (isRecordingShortcut) {
      isRecordingShortcut = false;
      input.value = presetCycleShortcut;
      input.style.borderColor = "var(--border)";
      recordBtn.textContent = "Record";
      return;
    }

    isRecordingShortcut = true;
    input.value = "Press keys…";
    input.style.borderColor = "var(--accent)";
    recordBtn.textContent = "Cancel";
  });

  window.addEventListener('keydown', async (e) => {
    if (!isRecordingShortcut) return;

    if (['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) return;

    e.preventDefault();

    const parts = [];
    if (e.altKey) parts.push('Alt');
    if (e.ctrlKey) parts.push('Ctrl');
    if (e.shiftKey) parts.push('Shift');
    if (e.metaKey) parts.push('Super');

    let keyName = e.key.toUpperCase();
    if (keyName === ' ') keyName = 'Space';
    parts.push(keyName);

    const combo = parts.join('+');
    presetCycleShortcut = combo;
    input.value = combo;
    input.style.borderColor = "var(--border)";
    recordBtn.textContent = "Record";
    isRecordingShortcut = false;

    await saveCycleSettings();
    toast(`Saved shortcut: ${combo}`, 'ok');
  });
}

document.getElementById('presetSearch').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  const filtered = presets.filter(p =>
    p.display_name.toLowerCase().includes(q) || p.description.toLowerCase().includes(q)
  );
  renderPresetList(filtered);
  if (selectedPreset) highlightActive(selectedPreset.name);
});

function highlightActive(name) {
  document.querySelectorAll('.preset-item').forEach(el => {
    el.classList.toggle('active', el.dataset.name === name);
  });
}

function selectPreset(preset, autoApply = true) {
  selectedPreset = preset;
  paramValues = {};
  highlightActive(preset.name);
  
  // Clear layout selection states when switching presets
  selectedStaticZones.clear();
  document.querySelectorAll('.zone-bar').forEach(bar => {
    bar.classList.remove('selected');
  });
  
  const tweaks = presetTweaks[preset.name];
  if (tweaks) {
    preset.parameters.forEach(p => {
      if (tweaks[p.name] !== undefined) {
        paramValues[p.name] = tweaks[p.name].value;
      } else {
        if (p.param_type.type === 'Color') {
          paramValues[p.name] = { r: p.param_type.r, g: p.param_type.g, b: p.param_type.b };
        } else {
          paramValues[p.name] = p.default;
        }
      }
    });

    if (preset.name === 'staticColor') {
      for (let i = 1; i <= 24; i++) {
        const k = `color${i}`;
        if (tweaks[k] !== undefined) {
          staticColors[i - 1] = tweaks[k].value;
        }
        paramValues[k] = staticColors[i - 1];
      }
    }

    if (preset.name === 'layered') {
      if (tweaks['config'] !== undefined) {
        try {
          const configStr = tweaks['config'].value;
          layeredConfig = JSON.parse(configStr);
          paramValues['config'] = configStr;
        } catch(e) {
          layeredConfig = [];
          paramValues['config'] = "[]";
        }
      } else {
        layeredConfig = [];
        paramValues['config'] = "[]";
      }
    }
  } else {
    if (preset.name === 'staticColor') {
      paramValues = {};
      for (let i = 1; i <= 24; i++) {
        paramValues[`color${i}`] = staticColors[i - 1];
      }
    } else if (preset.name === 'layered') {
      layeredConfig = [];
      paramValues['config'] = "[]";
    } else {
      paramValues = getDefaultParams(preset.name);
    }
  }

  renderParams(preset);

  if (autoApply) {
    applyPreset(true);
  }
}

// ─── Parameter Panel Rendering ───────────────────────────────────────────────
function renderParams(preset) {
  document.getElementById('paramPresetName').textContent = preset.display_name;
  document.getElementById('paramPresetDesc').textContent = preset.description;

  const container = document.getElementById('customParamsArea');
  container.innerHTML = '';
  document.getElementById('applyBar').style.display = 'flex';

  if (preset.name === 'staticColor') {
    renderStaticColorEditor(container);
    return;
  }

  if (preset.name === 'layered') {
    renderLayeredEditor(container);
    return;
  }

  if (preset.name === 'ambient') {
    renderAmbientEditor(container);
    return;
  }

  // Standard params list
  const grid = document.createElement('div');
  grid.className = 'params-grid';
  container.appendChild(grid);

  if (!preset.parameters || preset.parameters.length === 0) {
    grid.innerHTML = '<div class="no-params">No configurable parameters — click Apply to activate.</div>';
    applyPreset();
    return;
  }

  preset.parameters.forEach(p => {
    const card = document.createElement('div');
    card.className = 'param-card';

    // Get current/saved value or fallback to default
    if (paramValues[p.name] === undefined) {
      if (p.name === 'audio_source') {
        paramValues[p.name] = p.default;
      } else if (p.param_type.type === 'Color') {
        paramValues[p.name] = { r: p.param_type.r, g: p.param_type.g, b: p.param_type.b };
      } else {
        paramValues[p.name] = p.default;
      }
    }

    const val = paramValues[p.name];

    // Check if it is the audio_source selector
    if (p.name === 'audio_source') {
      card.innerHTML = `
        <div class="param-label">${p.label}</div>
        <select class="param-select" id="param-${p.name}">
          <option value="0">System Audio (Loopback monitor)</option>
          <option value="1">Microphone (Capture input)</option>
          <option value="2">Both (System + Mic mix)</option>
        </select>
      `;
      const select = card.querySelector('select');
      select.value = Math.round(val).toString();
      select.addEventListener('change', e => {
        paramValues[p.name] = parseFloat(e.target.value);
        debouncedApplyPreset();
      });
    } else if (p.param_type.type === 'Color') {
      const hex = rgbToHex(val.r, val.g, val.b);

      card.innerHTML = `
        <div class="param-label">${p.label}</div>
        <div class="color-row">
          <input type="color" id="param-${p.name}" value="${hex}">
          <span style="font-size:12px; color:var(--text-muted)">Click to select color</span>
        </div>
      `;
      card.querySelector('input').addEventListener('input', e => {
        const [r, g, b] = hexToRgb(e.target.value);
        paramValues[p.name] = { r, g, b };
        debouncedApplyPreset();
      });
    } else {
      // Standard Float Slider
      const precisionStr = val.toFixed(p.step < 0.1 ? 2 : p.step < 1 ? 1 : 0);
      card.innerHTML = `
        <div class="param-label">${p.label}</div>
        <div class="param-slider-row">
          <input type="range" id="param-${p.name}"
            min="${p.min}" max="${p.max}" step="${p.step}" value="${val}">
          <div class="param-val" id="pval-${p.name}">${precisionStr}</div>
        </div>
      `;
      const slider = card.querySelector('input');
      const valEl = card.querySelector('.param-val');
      slider.addEventListener('input', e => {
        paramValues[p.name] = parseFloat(e.target.value);
        valEl.textContent = parseFloat(e.target.value).toFixed(
          p.step < 0.1 ? 2 : p.step < 1 ? 1 : 0
        );
        debouncedApplyPreset();
      });
    }
    grid.appendChild(card);
  });
}

// ─── Ambient Preset Editor ───────────────────────────────────────────────────
function renderAmbientEditor(container) {
  const editorCard = document.createElement('div');
  editorCard.className = 'ambient-editor-container';

  // Initialize parameter values if undefined
  const defaultParams = {
    algorithm: 0.0,
    response_speed: 15.0,
    dynamic_mode: 0.0,
    saturation: 2.2,
    contrast: 1.3,
    black_cutoff: 0.08,
    min_brightness: 0.0,
    brightness_boost: 1.1,
    noise_threshold: 0.02,
    rect_x: 0.0,
    rect_y: 0.0,
    rect_width: 1.0,
    rect_height: 1.0,
  };

  // Support legacy 'smoothing' parameter if present in saved tweaks
  if (paramValues['smoothing'] !== undefined && paramValues['response_speed'] === undefined) {
    paramValues['response_speed'] = Math.min(50.0, Math.max(1.0, paramValues['smoothing'] * 5.0));
  }

  for (const [k, def] of Object.entries(defaultParams)) {
    if (paramValues[k] === undefined) {
      const pConfig = selectedPreset.parameters ? selectedPreset.parameters.find(pc => pc.name === k) : null;
      paramValues[k] = pConfig ? pConfig.default : def;
    }
  }

  // Helper algorithms metadata
  const algorithms = [
    { id: 0, name: "🌟 Vibrant Dominant (Vivid Colors)", desc: "Quantized chromatic clustering that isolates true rich colors from dull backgrounds. Ideal for games and anime." },
    { id: 1, name: "🔥 High Contrast Saturated (Deep Blacks & Pop)", desc: "Aggressive shadow suppression with S-curve contrast boost. Produces pitch-black letterboxes and punchy highlights." },
    { id: 2, name: "🌊 Perceptual Weighted Average (Harmonic Smooth)", desc: "Chroma-weighted integration that yields ultra-smooth, noiseless zone gradients without banding." },
    { id: 3, name: "💎 Dominant Hue (Color-Pure Modal)", desc: "24-bin modal hue extraction that reconstructs pure, crisp color hues without murky brown/gray mixing." },
    { id: 4, name: "⚡ Peak Chroma (Maximum Accent / Laser Focus)", desc: "Tracks the most vivid element or glowing accent in each zone (neon lights, lasers, spell effects)." },
    { id: 5, name: "🎬 Natural Cinema Average (True Linear sRGB)", desc: "Accurate linear color average with black floor suppression. Best for natural film & documentary viewing." },
    { id: 6, name: "🌈 Classic Saturated Average (Original Ambient)", desc: "The original pre-Linux ambient lighting algorithm: direct linear column downsampling with classic Rec.709 chroma-luminance saturation boost." }
  ];

  const dynamicModes = [
    { id: 0, name: "🚀 Dynamic (Fast Attack, Smooth Decay)", desc: "Snaps instantly to bright explosions and color bursts (2.5x speed), then decays gracefully to prevent LED strobe." },
    { id: 1, name: "〰️ Exponential Smooth (EMA Decay)", desc: "Buttery smooth exponential ease-in/ease-out transitions across all scenes." },

      </div>

    <!-- Dynamics Sliders Grid -->

        <div class="param-slider-row">

  editorCard.appendChild(dynamicsCard);

  container.appendChild(editorCard);

  // ───────────────────────────────────────────────────────────────────────────
  // BIND CONTROLS & EVENT HANDLERS
  // ───────────────────────────────────────────────────────────────────────────

  // 1. Algorithm dropdown binding
  const algoSelect = document.getElementById('param-algorithm');
  const algoDesc = document.getElementById('algoDescription');
  const updateAlgoDesc = (id) => {
    const item = algorithms.find(a => a.id === parseInt(id)) || algorithms[0];
    algoDesc.textContent = item.desc;

  algoSelect.value = Math.round(paramValues.algorithm).toString();
  updateAlgoDesc(algoSelect.value);
  algoSelect.addEventListener('change', e => {
    paramValues.algorithm = parseFloat(e.target.value);
    updateAlgoDesc(e.target.value);
    debouncedApplyPreset();
  });

  // 2. Dynamic mode dropdown binding
  const dynSelect = document.getElementById('param-dynamic_mode');
  const dynDesc = document.getElementById('dynamicModeDescription');
  const updateDynDesc = (id) => {
    const item = dynamicModes.find(d => d.id === parseInt(id)) || dynamicModes[0];
    dynDesc.textContent = item.desc;
  };
  dynSelect.value = Math.round(paramValues.dynamic_mode).toString();
  updateDynDesc(dynSelect.value);
  dynSelect.addEventListener('change', e => {
    paramValues.dynamic_mode = parseFloat(e.target.value);
    updateDynDesc(e.target.value);
    debouncedApplyPreset();
  });

  // 3. Bind all numeric range sliders
  const sliderIds = [
    { key: 'saturation', precision: 1, suffix: 'x' },
    { key: 'contrast', precision: 2, suffix: '' },
    { key: 'black_cutoff', precision: 2, suffix: '' },
    { key: 'min_brightness', precision: 2, suffix: '' },
    { key: 'brightness_boost', precision: 2, suffix: 'x' },
    { key: 'response_speed', precision: 0, suffix: '' },
    { key: 'noise_threshold', precision: 3, suffix: '' }
  ];

  sliderIds.forEach(({ key, precision, suffix }) => {
    const slider = document.getElementById(`param-${key}`);
    const valEl = document.getElementById(`pval-${key}`);
    if (slider && valEl) {
      slider.addEventListener('input', e => {
        paramValues[key] = parseFloat(e.target.value);
        valEl.textContent = paramValues[key].toFixed(precision) + suffix;
        debouncedApplyPreset();
      });
    }
  });

  // ───────────────────────────────────────────────────────────────────────────
  // 8-POINT SCREEN RESIZING & DRAGGING ENGINE
  // ───────────────────────────────────────────────────────────────────────────
  const wrapper = document.getElementById('mockScreenWrapper');
  const crop = document.getElementById('cropRect');
  const infoBadge = document.getElementById('cropInfoBadge');

  const numX = document.getElementById('num-rect_x');
  const numY = document.getElementById('num-rect_y');
  const numW = document.getElementById('num-rect_width');
  const numH = document.getElementById('num-rect_height');

  function updateVisualCrop(applyNetwork = false) {
    const wWidth = wrapper.clientWidth || 480;
    const wHeight = wrapper.clientHeight || 270;

    const x = paramValues.rect_x * wWidth;
    const y = paramValues.rect_y * wHeight;
    const w = paramValues.rect_width * wWidth;
    const h = paramValues.rect_height * wHeight;

    crop.style.left = `${x}px`;
    crop.style.top = `${y}px`;
    crop.style.width = `${w}px`;
    crop.style.height = `${h}px`;

    const pctX = Math.round(paramValues.rect_x * 100);
    const pctY = Math.round(paramValues.rect_y * 100);
    const pctW = Math.round(paramValues.rect_width * 100);
    const pctH = Math.round(paramValues.rect_height * 100);

    if (infoBadge) {
      infoBadge.textContent = `${pctW}% × ${pctH}% @ (${pctX}%, ${pctY}%)`;
    }

    if (numX) numX.value = pctX;
    if (numY) numY.value = pctY;
    if (numW) numW.value = pctW;
    if (numH) numH.value = pctH;

    // Check quick presets active state
    document.querySelectorAll('.crop-preset-btn').forEach(btn => {
      const [px, py, pw, ph] = btn.dataset.crop.split(',').map(parseFloat);
      const isMatch = Math.abs(paramValues.rect_x - px) < 0.02 &&
                      Math.abs(paramValues.rect_y - py) < 0.02 &&
                      Math.abs(paramValues.rect_width - pw) < 0.02 &&
                      Math.abs(paramValues.rect_height - ph) < 0.02;
      btn.classList.toggle('active', isMatch);
    });

    if (applyNetwork) {
      debouncedApplyPreset();
    }
  }

  // Initial update
  setTimeout(() => updateVisualCrop(false), 50);

  // ResizeObserver for container resizing
  const resizeObserver = new ResizeObserver(() => updateVisualCrop(false));
  resizeObserver.observe(wrapper);

  // Numeric coordinate inputs 2-way data binding
  const bindNumInput = (el, key, isWidthHeight = false) => {
    el.addEventListener('change', e => {
      let val = Math.max(0, Math.min(100, parseFloat(e.target.value) || 0)) / 100;
      if (isWidthHeight) {
        val = Math.max(0.05, Math.min(1.0, val));
      }
      paramValues[key] = parseFloat(val.toFixed(2));
      // Clamp bounds
      if (key === 'rect_x' && paramValues.rect_x + paramValues.rect_width > 1.0) {
        paramValues.rect_width = parseFloat((1.0 - paramValues.rect_x).toFixed(2));
      }
      if (key === 'rect_y' && paramValues.rect_y + paramValues.rect_height > 1.0) {
        paramValues.rect_height = parseFloat((1.0 - paramValues.rect_y).toFixed(2));
      }
      if (key === 'rect_width' && paramValues.rect_x + paramValues.rect_width > 1.0) {
        paramValues.rect_x = parseFloat((1.0 - paramValues.rect_width).toFixed(2));
      }
      if (key === 'rect_height' && paramValues.rect_y + paramValues.rect_height > 1.0) {
        paramValues.rect_y = parseFloat((1.0 - paramValues.rect_height).toFixed(2));
      }
      updateVisualCrop(true);
    });
  };

  bindNumInput(numX, 'rect_x', false);
  bindNumInput(numY, 'rect_y', false);
  bindNumInput(numW, 'rect_width', true);
  bindNumInput(numH, 'rect_height', true);

  // Quick Presets Buttons Click
  screenCard.querySelectorAll('.crop-preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const [px, py, pw, ph] = btn.dataset.crop.split(',').map(parseFloat);
      paramValues.rect_x = px;
      paramValues.rect_y = py;
      paramValues.rect_width = pw;
      paramValues.rect_height = ph;
      updateVisualCrop(true);
    });
  });

  // 8-Point Multi-Corner & Edge Interactive Dragging
  let activeInteraction = null; // 'drag' or handle name: 'nw', 'ne', 'sw', 'se', 'n', 's', 'w', 'e'
  let startX = 0, startY = 0;
  let startRect = { x: 0, y: 0, w: 0, h: 0 };

  const onPointerDown = (e, interactionType) => {
    activeInteraction = interactionType;
    startX = e.clientX || (e.touches && e.touches[0].clientX);
    startY = e.clientY || (e.touches && e.touches[0].clientY);

    const wWidth = wrapper.clientWidth;
    const wHeight = wrapper.clientHeight;

    startRect = {
      x: paramValues.rect_x * wWidth,
      y: paramValues.rect_y * wHeight,
      w: paramValues.rect_width * wWidth,
      h: paramValues.rect_height * wHeight,
    };

    crop.classList.add('active-drag');
    e.preventDefault();
    e.stopPropagation();
  };

  // Bind handles
  crop.querySelectorAll('.crop-handle').forEach(handle => {
    const handleType = handle.dataset.handle;
    handle.addEventListener('mousedown', e => onPointerDown(e, handleType));
    handle.addEventListener('touchstart', e => onPointerDown(e, handleType), { passive: false });
  });

  // Bind body drag
  crop.addEventListener('mousedown', e => {
    if (e.target.classList.contains('crop-handle')) return;
    onPointerDown(e, 'drag');
  });
  crop.addEventListener('touchstart', e => {
    if (e.target.classList.contains('crop-handle')) return;
    onPointerDown(e, 'drag');
  }, { passive: false });

  const onPointerMove = (e) => {
    if (!activeInteraction) return;

    const curX = e.clientX || (e.touches && e.touches[0].clientX);
    const curY = e.clientY || (e.touches && e.touches[0].clientY);
    const dx = curX - startX;
    const dy = curY - startY;

    const wWidth = wrapper.clientWidth;
    const wHeight = wrapper.clientHeight;
    const minSize = 16; // min pixel size

    let newX = startRect.x;
    let newY = startRect.y;
    let newW = startRect.w;
    let newH = startRect.h;

    if (activeInteraction === 'drag') {
      newX = Math.max(0, Math.min(startRect.x + dx, wWidth - startRect.w));
      newY = Math.max(0, Math.min(startRect.y + dy, wHeight - startRect.h));
    } else {
      // 8-direction resizing
      if (activeInteraction.includes('e')) {
        newW = Math.max(minSize, Math.min(startRect.w + dx, wWidth - startRect.x));
      }
      if (activeInteraction.includes('s')) {
        newH = Math.max(minSize, Math.min(startRect.h + dy, wHeight - startRect.y));
      }
      if (activeInteraction.includes('w')) {
        const potentialW = startRect.w - dx;
        if (potentialW >= minSize) {
          const potentialX = startRect.x + dx;
          if (potentialX >= 0) {
            newX = potentialX;
            newW = potentialW;
          } else {
            newX = 0;
            newW = startRect.x + startRect.w;
          }
        } else {
          newX = startRect.x + startRect.w - minSize;
          newW = minSize;
        }
      }
      if (activeInteraction.includes('n')) {
        const potentialH = startRect.h - dy;
        if (potentialH >= minSize) {
          const potentialY = startRect.y + dy;
          if (potentialY >= 0) {
            newY = potentialY;
            newH = potentialH;
          } else {
            newY = 0;
            newH = startRect.y + startRect.h;
          }
        } else {
          newY = startRect.y + startRect.h - minSize;
          newH = minSize;
        }
      }
    }

    // Convert to fractions [0.0 .. 1.0]
    paramValues.rect_x = parseFloat((newX / wWidth).toFixed(2));
    paramValues.rect_y = parseFloat((newY / wHeight).toFixed(2));
    paramValues.rect_width = parseFloat((newW / wWidth).toFixed(2));
    paramValues.rect_height = parseFloat((newH / wHeight).toFixed(2));

    updateVisualCrop(true);
  };

  const onPointerUp = () => {
    if (activeInteraction) {
      crop.classList.remove('active-drag');
      applyPreset(false);
      activeInteraction = null;
    }
  };

  document.addEventListener('mousemove', onPointerMove);
  document.addEventListener('touchmove', onPointerMove, { passive: false });
  document.addEventListener('mouseup', onPointerUp);
  document.addEventListener('touchend', onPointerUp);
}

// ─── 24-Zone Static Color Palette Editor ──────────────────────────────────────
function renderStaticColorEditor(container) {
  // Reset selection
  selectedStaticZones.clear();
  document.querySelectorAll('.zone-bar').forEach(bar => {
    bar.classList.remove('selected');
  });

  const editorCard = document.createElement('div');
  editorCard.className = 'zone-editor-container';

  // Instruction text explaining direct editing
  const instructions = document.createElement('div');
  instructions.style.fontSize = '12px';
  instructions.style.color = 'var(--text-muted)';
  instructions.style.marginBottom = '16px';
  instructions.style.textAlign = 'center';
  instructions.innerHTML = `
    <span style="color: var(--primary); font-weight: 600;">Direct Layout Editing:</span> 
    Click or drag over the zones on the keyboard layout above to select them, then use the controls below to colorize.
  `;
  editorCard.appendChild(instructions);

  // Controls row
  const controls = document.createElement('div');
  controls.className = 'zone-editor-controls';
  controls.innerHTML = `
    <div class="zone-editor-actions">
      <button class="btn-sm" id="btnStaticSelectAll">Select All</button>
      <button class="btn-sm" id="btnStaticInvert">Invert</button>
      <button class="btn-sm" id="btnStaticClear">Clear Selection</button>
    </div>
    <div class="color-row" style="margin-left: 12px;">
      <span class="param-label" style="margin-bottom:0">Fill selected:</span>
      <input type="color" id="staticFillPicker" value="#ffffff">
    </div>
    <div class="gradient-builder">
      <span class="param-label" style="margin-bottom:0">Gradient:</span>
      <input type="color" id="gradStart" value="#a855f7">
      <input type="color" id="gradEnd" value="#ec4899">
      <button class="btn-sm" id="btnApplyGradient" style="padding: 4px 8px;">Apply</button>
    </div>
  `;
  editorCard.appendChild(controls);
  container.appendChild(editorCard);

  // Wire up action listeners
  controls.querySelector('#btnStaticSelectAll').addEventListener('click', () => {
    const bars = document.querySelectorAll('.zone-bar');
    bars.forEach((bar, idx) => {
      selectedStaticZones.add(idx);
      bar.classList.add('selected');
    });
  });

  controls.querySelector('#btnStaticInvert').addEventListener('click', () => {
    const bars = document.querySelectorAll('.zone-bar');
    bars.forEach((bar, idx) => {
      if (selectedStaticZones.has(idx)) {
        selectedStaticZones.delete(idx);
        bar.classList.remove('selected');
      } else {
        selectedStaticZones.add(idx);
        bar.classList.add('selected');
      }
    });
  });

  controls.querySelector('#btnStaticClear').addEventListener('click', () => {
    const bars = document.querySelectorAll('.zone-bar');
    bars.forEach(bar => bar.classList.remove('selected'));
    selectedStaticZones.clear();
  });

  // Bulk color fill picker
  controls.querySelector('#staticFillPicker').addEventListener('input', e => {
    const [r, g, b] = hexToRgb(e.target.value);
    if (selectedStaticZones.size === 0) return;
    
    selectedStaticZones.forEach(idx => {
      staticColors[idx] = { r, g, b };
    });
    syncStaticValues();
  });

  // Gradient Apply
  controls.querySelector('#btnApplyGradient').addEventListener('click', () => {
    const startHex = controls.querySelector('#gradStart').value;
    const endHex = controls.querySelector('#gradEnd').value;
    const startRgb = hexToRgb(startHex);
    const endRgb = hexToRgb(endHex);
    
    // Gradient interpolates either across selection or entire strip if nothing is selected
    const targetIndices = selectedStaticZones.size > 0 
      ? Array.from(selectedStaticZones).sort((a,b)=>a-b)
      : Array.from({length: 24}, (_, i) => i);
      
    if (targetIndices.length < 2) {
      toast('Select at least 2 zones for a gradient', 'err');
      return;
    }
    
    const count = targetIndices.length;
    targetIndices.forEach((idx, i) => {
      const t = i / (count - 1);
      const r = Math.round(startRgb[0] + (endRgb[0] - startRgb[0]) * t);
      const g = Math.round(startRgb[1] + (endRgb[1] - startRgb[1]) * t);
      const b = Math.round(startRgb[2] + (endRgb[2] - startRgb[2]) * t);
      staticColors[idx] = { r, g, b };
    });
    syncStaticValues();
  });

  syncStaticValues();
}

function toggleZoneSelection(idx, cell) {
  if (selectedStaticZones.has(idx)) {
    selectedStaticZones.delete(idx);
    cell.classList.remove('selected');
  } else {
    selectedStaticZones.add(idx);
    cell.classList.add('selected');
  }
}

let applyPresetTimeout = null;
let lastApplyPresetTime = 0;

function debouncedApplyPreset() {
  if (!selectedPreset) return;
  const now = Date.now();
  const timeSinceLast = now - lastApplyPresetTime;
  
  if (applyPresetTimeout) {
    clearTimeout(applyPresetTimeout);
    applyPresetTimeout = null;
  }
  
  if (timeSinceLast >= 50) { // Max 20 updates per second to protect the hardware
    lastApplyPresetTime = now;
    applyPreset(false);
  } else {
    applyPresetTimeout = setTimeout(() => {
      lastApplyPresetTime = Date.now();
      applyPreset(false);
    }, 50 - timeSinceLast);
  }
}

function syncStaticValues() {
  const glows = document.querySelectorAll('.zone-glow');
  for (let i = 0; i < 24; i++) {
    paramValues[`color${i + 1}`] = staticColors[i];
    if (glows[i]) {
      const c = staticColors[i];
      if (c.r === 0 && c.g === 0 && c.b === 0) {
        glows[i].style.background = 'transparent';
      } else {
        glows[i].style.background = `rgb(${c.r}, ${c.g}, ${c.b})`;
      }
    }
  }
  debouncedApplyPreset();
}

// ─── Layered Effect Builder Editor ───────────────────────────────────────────
function renderLayeredEditor(container) {
  container.innerHTML = '';
  const editor = document.createElement('div');
  editor.className = 'layers-container';

  // Add Layer Header Bar
  const addBar = document.createElement('div');
  addBar.className = 'add-layer-bar';
  
  const select = document.createElement('select');
  select.className = 'param-select';
  select.style.flex = '1';
  presets.forEach(p => {
    // Exclude layered itself from sub-presets to avoid recursions
    if (p.name !== 'layered') {
      const opt = document.createElement('option');
      opt.value = p.name;
      opt.textContent = p.display_name;
      select.appendChild(opt);
    }
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'btn-sm';
  addBtn.style.padding = '8px 16px';
  addBtn.textContent = 'Add Layer +';
  addBtn.addEventListener('click', () => {
    addLayer(select.value);
  });

  addBar.appendChild(select);
  addBar.appendChild(addBtn);
  editor.appendChild(addBar);

  // Active Layers List
  const list = document.createElement('div');
  list.style.display = 'flex';
  list.style.flexDirection = 'column';
  list.style.gap = '8px';

  if (layeredConfig.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'no-params';
    empty.style.textAlign = 'center';
    empty.style.padding = '24px';
    empty.textContent = 'No layers added yet. Choose an effect above to start layering.';
    list.appendChild(empty);
  } else {
    layeredConfig.forEach((layer, idx) => {
      const card = document.createElement('div');
      card.className = 'layer-card';

      // Header row with details & actions
      const header = document.createElement('div');
      header.className = 'layer-card-header';
      
      const title = document.createElement('div');
      title.className = 'layer-title';
      title.innerHTML = `<span style="color:var(--text-muted); font-size:11px; margin-right:4px;">#${idx+1}</span> ${layer.display_name}`;
      header.appendChild(title);

      const toggleSet = document.createElement('button');
      toggleSet.className = 'layer-settings-toggle';
      toggleSet.textContent = openLayerSettingsIndex === idx ? 'Close Settings ▲' : 'Edit Settings ▼';
      toggleSet.addEventListener('click', () => {
        openLayerSettingsIndex = openLayerSettingsIndex === idx ? null : idx;
        renderLayeredEditor(container);
      });
      header.appendChild(toggleSet);

      // Reordering buttons (Move Up/Down)
      const btnUp = document.createElement('button');
      btnUp.className = 'layer-action-btn';
      btnUp.textContent = '▲';
      btnUp.disabled = idx === 0;
      btnUp.addEventListener('click', () => {
        const temp = layeredConfig[idx];
        layeredConfig[idx] = layeredConfig[idx - 1];
        layeredConfig[idx - 1] = temp;
        // Re-assign priorities based on order
        layeredConfig.forEach((l, i) => l.priority = i + 1);
        syncLayeredConfigJSON();
        applyPreset(false);
        renderLayeredEditor(container);
      });
      header.appendChild(btnUp);

      const btnDown = document.createElement('button');
      btnDown.className = 'layer-action-btn';
      btnDown.textContent = '▼';
      btnDown.disabled = idx === layeredConfig.length - 1;
      btnDown.addEventListener('click', () => {
        const temp = layeredConfig[idx];
        layeredConfig[idx] = layeredConfig[idx + 1];
        layeredConfig[idx + 1] = temp;
        layeredConfig.forEach((l, i) => l.priority = i + 1);
        syncLayeredConfigJSON();
        applyPreset(false);
        renderLayeredEditor(container);
      });
      header.appendChild(btnDown);

      // Delete layer
      const btnDel = document.createElement('button');
      btnDel.className = 'layer-action-btn';
      btnDel.style.borderColor = 'rgba(239, 68, 68, 0.3)';
      btnDel.style.color = 'var(--error)';
      btnDel.textContent = '✕';
      btnDel.addEventListener('click', () => {
        layeredConfig.splice(idx, 1);
        layeredConfig.forEach((l, i) => l.priority = i + 1);
        syncLayeredConfigJSON();
        applyPreset(false);
        renderLayeredEditor(container);
      });
      header.appendChild(btnDel);

      card.appendChild(header);

      // Opacity row
      const opRow = document.createElement('div');
      opRow.className = 'layer-opacity-row';
      opRow.innerHTML = `
        <span class="param-label" style="margin-bottom:0">Opacity:</span>
        <input type="range" min="0" max="100" value="${Math.round(layer.opacity * 100)}">
        <span style="font-family:'JetBrains Mono', monospace; font-size:11px; width:34px; text-align:right;">${Math.round(layer.opacity * 100)}%</span>
      `;
      const slider = opRow.querySelector('input');
      const text = opRow.querySelector('span:last-child');
      slider.addEventListener('input', e => {
        const val = parseInt(e.target.value) / 100;
        layer.opacity = val;
        text.textContent = e.target.value + '%';
        syncLayeredConfigJSON();
        debouncedApplyPreset();
      });
      card.appendChild(opRow);

      // Settings Grid (if expanded)
      if (openLayerSettingsIndex === idx) {
        const subParams = document.createElement('div');
        subParams.className = 'layer-sub-params';

        const meta = presets.find(p => p.name === layer.name);
        if (meta && meta.parameters && meta.parameters.length > 0) {
          meta.parameters.forEach(p => {
            const row = document.createElement('div');
            row.className = 'param-card';
            row.style.background = 'rgba(255,255,255,0.01)';
            row.style.padding = '8px';

            if (p.name === 'audio_source') {
              row.innerHTML = `
                <div class="param-label" style="font-size:9px;">${p.label}</div>
                <select class="param-select" style="padding: 6px 8px; font-size:12px;">
                  <option value="0">System Audio</option>
                  <option value="1">Microphone</option>
                  <option value="2">Both</option>
                </select>
              `;
              const select = row.querySelector('select');
              select.value = Math.round(layer.parameters[p.name] || p.default).toString();
              select.addEventListener('change', e => {
                layer.parameters[p.name] = parseFloat(e.target.value);
                syncLayeredConfigJSON();
                debouncedApplyPreset();
              });
            } else if (p.param_type.type === 'Color') {
              const val = layer.parameters[p.name] || p.param_type;
              const hex = rgbToHex(val.r, val.g, val.b);
              row.innerHTML = `
                <div class="param-label" style="font-size:9px;">${p.label}</div>
                <div class="color-row">
                  <input type="color" value="${hex}" style="width:36px; height:24px;">
                </div>
              `;
              row.querySelector('input').addEventListener('input', e => {
                const [r, g, b] = hexToRgb(e.target.value);
                layer.parameters[p.name] = { r, g, b };
                syncLayeredConfigJSON();
                debouncedApplyPreset();
              });
            } else {
              // Float
              const val = layer.parameters[p.name] !== undefined ? layer.parameters[p.name] : p.default;
              row.innerHTML = `
                <div class="param-label" style="font-size:9px;">${p.label}</div>
                <div class="param-slider-row">
                  <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${val}">
                  <span style="font-family:'JetBrains Mono'; font-size:11px;">${val}</span>
                </div>
              `;
              const slider = row.querySelector('input');
              const valText = row.querySelector('span');
              slider.addEventListener('input', e => {
                const v = parseFloat(e.target.value);
                layer.parameters[p.name] = v;
                valText.textContent = v.toFixed(p.step < 0.1 ? 2 : p.step < 1 ? 1 : 0);
                syncLayeredConfigJSON();
                debouncedApplyPreset();
              });
            }
            subParams.appendChild(row);
          });
        } else {
          subParams.innerHTML = '<div class="no-params" style="font-size:11px;">No adjustable settings for this effect.</div>';
        }
        card.appendChild(subParams);
      }

      list.appendChild(card);
    });
  }

  editor.appendChild(list);
  container.appendChild(editor);
  syncLayeredConfigJSON();
}

function getDefaultParams(presetName) {
  const p = presets.find(pr => pr.name === presetName);
  if (!p) return {};
  const params = {};
  p.parameters.forEach(param => {
    if (param.param_type.type === 'Color') {
      params[param.name] = { r: param.param_type.r, g: param.param_type.g, b: param.param_type.b };
    } else {
      params[param.name] = param.default;
    }
  });
  return params;
}

function getTweakedOrDefaultParams(presetName) {
  const p = presets.find(pr => pr.name === presetName);
  if (!p) return {};
  const params = {};
  const tweaks = presetTweaks[presetName] || {};
  p.parameters.forEach(param => {
    if (tweaks[param.name] !== undefined) {
      params[param.name] = tweaks[param.name].value;
    } else {
      if (param.param_type.type === 'Color') {
        params[param.name] = { r: param.param_type.r, g: param.param_type.g, b: param.param_type.b };
      } else {
        params[param.name] = param.default;
      }
    }
  });
  return params;
}

function addLayer(presetName) {
  const meta = presets.find(p => p.name === presetName);
  if (!meta) return;
  const layer = {
    name: presetName,
    display_name: meta.display_name,
    opacity: 1.0,
    priority: layeredConfig.length + 1,
    parameters: getTweakedOrDefaultParams(presetName)
  };
  layeredConfig.push(layer);
  syncLayeredConfigJSON();
  applyPreset(false);
  renderLayeredEditor(document.getElementById('customParamsArea'));
}

function syncLayeredConfigJSON() {
  // Format each layer back to the backend's expected structure
  const formatted = layeredConfig.map(l => ({
    name: l.name,
    opacity: l.opacity,
    priority: l.priority,
    parameters: l.parameters
  }));
  paramValues['config'] = JSON.stringify(formatted);
}

// ─── Apply preset ─────────────────────────────────────────────────────────────
document.getElementById('applyBtn').addEventListener('click', () => applyPreset(true));

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!selectedPreset) return;
  
  if (selectedPreset.name === 'layered') {
    layeredConfig = [];
    openLayerSettingsIndex = null;
    paramValues = { config: "[]" };
  } else if (selectedPreset.name === 'staticColor') {
    paramValues = {};
    for (let i = 1; i <= 24; i++) {
      paramValues[`color${i}`] = { r: 255, g: 255, b: 255 };
    }
  } else {
    paramValues = getDefaultParams(selectedPreset.name);
  }
  
  renderParams(selectedPreset);
  applyPreset(false);
  toast(`↺ Parameters reset to defaults`, 'ok');
});

async function applyPreset(showToast = true) {
  if (!selectedPreset) return;

  const params = {};
  for (const [k, v] of Object.entries(paramValues)) {
    params[k] = v;
  }

  try {
    const res = await api('POST', '/api/preset', { preset: selectedPreset.name, params });
    if (res.ok) {
      if (showToast) {
        toast(`✦ ${selectedPreset.display_name} activated`, 'ok');
      }
      
      if (!presetTweaks[selectedPreset.name]) {
        presetTweaks[selectedPreset.name] = {};
      }
      for (const [k, v] of Object.entries(params)) {
        if (v && typeof v === 'object' && v.r !== undefined) {
          presetTweaks[selectedPreset.name][k] = { type: 'Color', value: v };
        } else if (typeof v === 'string') {
          presetTweaks[selectedPreset.name][k] = { type: 'String', value: v };
        } else {
          presetTweaks[selectedPreset.name][k] = { type: 'Float', value: v };
        }
      }
    } else {
      toast('Error: ' + (res.error || 'Unknown'), 'err');
    }
  } catch(e) {
    toast('Network error', 'err');
  }
}

// ─── Brightness ───────────────────────────────────────────────────────────────
function setupBrightness() {
  const slider = document.getElementById('brightnessSlider');
  const val = document.getElementById('brightnessVal');
  slider.addEventListener('input', e => {
    val.textContent = e.target.value + '%';
    clearTimeout(brightnessDebounce);
    brightnessDebounce = setTimeout(async () => {
      await api('POST', '/api/brightness', { brightness: parseInt(e.target.value) / 100 });
    }, 150);
  });
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2800);
}

// ─── Colors ───────────────────────────────────────────────────────────────────
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function hexToRgb(hex) {
  const m = hex.replace('#','').match(/.{2}/g);
  return m.map(h => parseInt(h, 16));
}
